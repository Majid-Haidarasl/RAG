[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-core"
version = "1.0.0"
description = "Offline hierarchical RAG core for ArmanRayan — knowledge, issues, transfer, RFPs and evaluation on a local LLM"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary — student project"}
authors = [{name = "Majid Haidarasl"}]
dependencies = [
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "jsonschema>=4.20",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "coverage>=7.6",
    "ruff==0.17.6",
]
lvm = [
    "Pillow>=10.0",
    "pypdfium2>=4.0",
]

[tool.ruff]
target-version = "py312"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "hierarchy: Organizational Hierarchy context",
    "knowledge: Knowledge Management context",
    "rag: RAG Core context",
    "issues: Issue Management context",
    "executors: Executor Management context",
    "ike: IKE context",
    "transfer: Knowledge Transfer context",
    "judging: Evaluation & Judging context",
    "rfp: RFP & Proposal context",
    "models: Model & Prompt Management context",
    "shared_kernel: shared kernel value objects",
    "ingestion: document ingestion, chunking and metadata",
    "lifecycle: Phase 5 version and chunk lifecycle",
    "dedup: Phase 5 duplicate, near-duplicate and overlap detection",
    "registry: Phase 6 layer / node registry, workflows and retrieval scope",
    "issue_model: Phase 7 issue / sub-issue model, comparison and decomposition",
    "retrieval: Phase 8 hybrid retrieval, index and context assembly",
    "qa: Phase 8 node-scoped Q&A, citations and fact check",
    "matching: Phase 9 executor profiles, expertise metadata, capacity and matching",
    "ike_model: Phase 9 IKE relations, issue-knowledge comparison and summaries",
    "judge: Phase 10 judge rubric, score parser, thresholds, rule judge and LLM judge",
    "processing: Phase 11 cyclic node processing (cycle, bottom-up plan, cycle runner)",
    "transfer_pkg: Phase 11 TransferPackage generation, detail levels, review, suggestions and storage",
    "projects: Phase 12 project tracking (projects, achievements, challenges, research, unsolved issues, scorecard)",
    "research_gaps: Phase 12 research-gap rules and gap report",
    "prioritization: Phase 12 weighted key-issue prioritization, sensitivity, next action and key-issue brief",
    "rfp_gen: Phase 13 RFP blueprints, validation, grounding, candidate selection and template RFP generation",
    "proposals: Phase 13 proposal registry, weighted evaluation, decision check, feedback and knowledge links",
    "tuning: Phase 14 Prompt Testing & Model Tuning context",
    "eval_gold: Phase 14 bilingual gold set, its validation and grounding in the corpus",
    "eval_metrics: Phase 14 ranking metrics, judge agreement, variant choice and required-id variants",
    "hardening: Phase 15 edge cases, error paths and input validation of earlier contexts",
    "quality: Phase 15 coverage report, coverage gate, release checklist and test inventory",
    "release: Phase 16 release check (versions, documents, phrase scan, slides, evidence, changelog)",
    "carryover: Phase 15 fixes of the Phase 14 findings (fact pre-check, invented-id guard, new defaults)",
    "slow: reads the real corpus (a few seconds)",
]

[tool.coverage.run]
source = ["rag_core"]
branch = true
omit = ["*/infrastructure/ollama_*", "*/infrastructure/parsers*"]

[tool.coverage.report]
# The Phase 15 gate lives in config/quality.yaml (coverage.min_line_pct) and is checked by
# scripts/run_quality_check.py, so a low number shows up in the summary instead of failing pytest.
fail_under = 0
show_missing = true
skip_empty = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "^\\s*\\.\\.\\.\\s*$", "^\\s*def .*: \\.\\.\\.\\s*$"]

[tool.coverage.html]
directory = "results/phase-15/htmlcov"
