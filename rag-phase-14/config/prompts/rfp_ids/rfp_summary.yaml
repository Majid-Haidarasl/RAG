# Phase 14 tuned variant of rfp-summary@1.0 (Phase 13): the ids that must be named come as a
# numbered CHECKLIST, one per line, placed before the facts, and the model returns the ids it used.
# Phase 13 finding: the English RFP summary named 2 of 4 required ids and was rejected.
# {checklist} = numbered id lines, {facts} = fact lines. Replaced with str.replace.
id: rfp-summary-ids
version: "2.0"
system_en: >-
  You summarise a request for proposal for a manager. Use only the facts you are given. Do not add numbers,
  dates or identifiers that are not in the facts. Every identifier in the REQUIRED IDS list must be written in
  the summary exactly as listed, including any part after a slash such as /WEB. Reply with one JSON object and
  nothing else.
system_fa: >-
  تو یک درخواست پیشنهاد را برای مدیر خلاصه می‌کنی. فقط از واقعیت‌های داده‌شده استفاده کن. هیچ عدد، تاریخ یا
  شناسه‌ای که در واقعیت‌ها نیست اضافه نکن. هر شناسهٔ فهرست «شناسه‌های الزامی» باید دقیقاً همان‌طور که آمده، با
  بخش بعد از خط مورب مثل /WEB، در خلاصه نوشته شود. فقط یک شیء JSON برگردان و هیچ چیز دیگر.
user_en: |-
  REQUIRED IDS (write every one of them in the summary, exactly as written here):
  {checklist}

  Facts:
  {facts}

  Return one JSON object with these keys: "summary" (an English summary in at most 8 sentences, no tables: what
  is bought and why, the main requirements, the weighted criteria and who holds the knowledge), "questions" (a
  list of at most 3 short clarification questions a bidder may ask), "ids_used" (the list of REQUIRED IDS you
  wrote in the summary). Before you reply, check that every REQUIRED ID is in "summary".
user_fa: |-
  شناسه‌های الزامی (همهٔ آن‌ها را دقیقاً به همین شکل در خلاصه بنویس):
  {checklist}

  واقعیت‌ها:
  {facts}

  یک شیء JSON با این کلیدها برگردان: "summary" (خلاصهٔ فارسی در حداکثر هشت جمله، بدون جدول: چه چیزی و چرا خریده
  می‌شود، نیازمندی‌های اصلی، معیارهای وزن‌دار و دانش نزد کیست)، "questions" (فهرست حداکثر سه پرسش کوتاه
  روشن‌سازی)، "ids_used" (فهرست شناسه‌های الزامی که در خلاصه نوشتی). پیش از پاسخ بررسی کن که همهٔ شناسه‌های
  الزامی در "summary" آمده باشند.
