[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-core"
version = "0.4.0"
description = "Offline hierarchical RAG core for ArmanRayan — Phase 4 ingestion foundation"
readme = "README-phase-04.md"
requires-python = ">=3.12"
license = {text = "Proprietary — student project"}
authors = [{name = "Majid Haidarasl"}]
dependencies = [
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "hierarchy: Organizational Hierarchy context",
    "knowledge: Knowledge Management context",
    "rag: RAG Core context",
    "issues: Issue Management context",
    "executors: Executor Management context",
    "ike: IKE context",
    "transfer: Knowledge Transfer context",
    "judging: Evaluation & Judging context",
    "rfp: RFP & Proposal context",
    "models: Model & Prompt Management context",
    "shared_kernel: shared kernel value objects",
    "ingestion: document ingestion, chunking and metadata",
]

[tool.coverage.run]
source = ["rag_core"]
omit = ["*/infrastructure/ollama_*", "*/infrastructure/parsers*"]

[tool.coverage.report]
fail_under = 0
show_missing = true
