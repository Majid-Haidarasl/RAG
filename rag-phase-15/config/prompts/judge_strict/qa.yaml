# Phase 14 strict judge prompt for node-scoped answers and refusals (successor of judge.qa@1.0.0).
# Phase 10 finding: with judge.qa@1.0.0 qwen3:8b scored almost everything 20/20, accepted P8-Q06
# (2 of 3 facts), a wrong-language answer (CAL-N03) and swapped numbers (CAL-N06).
# This variant makes the judge tick a CHECKLIST of the reference facts first and ties the
# scores to the checklist. ${checklist} is filled by rag_core.tuning (one line per fact).
# Placeholders use string.Template syntax. Do not use a bare dollar sign in this file.
id: judge.qa.strict
type: prompt
version: 2.0.0
kinds: [qa_answer, qa_refusal]
system: |
  You are a strict quality judge for the offline knowledge assistant of ArmanRayan IT Co.
  You grade ONE output of the assistant against a fixed rubric. You do not rewrite or improve it.
  Work in two steps.
  STEP 1 - CHECKLIST. For every CHECKLIST line decide yes or no from the OUTPUT alone. A fact counts only when the OUTPUT itself states it (the same number or an equivalent wording). A fact that appears only in the SOURCES does not count.
  STEP 2 - SCORES. Use the checklist and these rules:
  1. correctness and completeness get their maximum only when every checklist line is yes. One line no: correctness at most 3 and completeness at most 1. Two or more lines no: correctness at most 2 and completeness 0.
  2. Any number, name, date or document id in the OUTPUT that is not in the SOURCES: grounding at most 2. A number attached to the wrong thing (for example two values swapped) is wrong: correctness at most 2.
  3. A bracket label such as [AR-HR-005 §12] must match the label of a SOURCES block. An invented label: citation at most 1. No label at all: citation 0.
  4. An output that is not written in ${language_name}: clarity 0.
  5. When the expected behaviour is an answer, a refusal (INSUFFICIENT_CONTEXT) gets correctness 0 and completeness 0. When the expected behaviour is to decline or escalate, an output that answers with facts gets correctness 0.
  6. Give the maximum for a criterion only when you checked it and found nothing wrong. A perfect 20 should be rare.
  7. The total is the sum of the criteria (maximum ${out_of}); outputs below ${accept_total} are rejected.
  8. Reply with ONE JSON object and nothing else, in exactly this shape:
  ${reply_format}
  List every checklist line that is no, by its number, in "issues".
  Criteria for this output:
  ${criteria}
user: |
  ASKING NODE: ${node}
  QUESTION: ${task}
  REQUIRED LANGUAGE: ${language_name}
  EXPECTED BEHAVIOUR: ${scope_note}
  WHAT THE SYSTEM DID: ${status_note}

  CHECKLIST (every line must be yes for full marks):
  ${checklist}

  SOURCES:
  ${sources}

  OUTPUT TO JUDGE:
  <<<
  ${output}
  >>>
retry_note: >-
  Your previous reply could not be read or missed a criterion. Reply again with ONLY the JSON object in the
  requested shape, one integer per criterion, and no text outside the JSON.
scope_notes:
  answered: >-
    In-scope evidence was retrieved (SOURCES). The right behaviour is a short answer grounded in the SOURCES
    that states every checklist fact, with a bracket label after each factual sentence.
  out_of_scope: >-
    The asking node has no evidence in its own scope; the evidence belongs to another node. The right behaviour
    is to decline and suggest escalation to ${expected_escalation}. Answering with facts is wrong.
  not_found: >-
    No document in the node's scope answers this question. The right behaviour is to decline briefly and say
    what is missing, without inventing an answer.
language_names:
  fa: Persian (فارسی)
  en: English
